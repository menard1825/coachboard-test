<div class="modal fade" id="lineupEditorModal" tabindex="-1" aria-labelledby="lineupEditorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-sm-down modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h5 class="modal-title" id="lineupEditorModalLabel">Batting Lineup</h5>
                    <div class="small text-muted" id="lineupEditorSubtitle">Build the order with taps or drag handles.</div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="card bg-light border-0 mb-3" id="lineupSourceCard">
                    <div class="card-body p-3">
                        <label for="lineupTemplateSelect" class="form-label fw-semibold mb-1">Start from</label>
                        <div class="input-group">
                            <select id="lineupTemplateSelect" class="form-select"><option value="">Blank lineup</option></select>
                            <button type="button" class="btn btn-outline-primary" id="applyLineupSourceBtn">Apply</button>
                        </div>
                        <div class="form-text">Nothing changes until you choose a source and tap Apply.</div>
                    </div>
                </div>
                <div id="lineupEditorFeedback" class="d-none" role="status"></div>
                <div id="lineupEditorStatus" class="alert alert-light border py-2 mb-3"></div>
                <input type="hidden" id="lineupId" value="">
                <div class="row g-2 align-items-end mb-3">
                    <div class="col-md">
                        <label for="lineupTitle" class="form-label fw-semibold">Lineup name</label>
                        <input type="text" class="form-control" id="lineupTitle" maxlength="120" placeholder="Example: Everyday batting order" required>
                    </div>
                    <div class="col-md-auto">
                        <button type="button" class="btn btn-outline-secondary w-100" id="rotateLineupBtn"><i class="bi bi-arrow-repeat me-1"></i>Rotate top to bottom</button>
                    </div>
                </div>
                <div class="form-check form-switch mb-3" id="lineupDefaultWrap">
                    <input class="form-check-input" type="checkbox" role="switch" id="lineupIsDefault">
                    <label class="form-check-label" for="lineupIsDefault">Use as the default Game Day template</label>
                </div>
                <div class="row g-3" id="lineup-editor-lists">
                    <div class="col-lg-7">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <h6 class="mb-0">Batting Order</h6>
                            <span class="small text-muted d-none d-md-inline">Drag the grip or use arrows</span>
                        </div>
                        <div id="lineup-order" class="list-group border rounded overflow-auto" style="max-height: 52vh;"></div>
                    </div>
                    <div class="col-lg-5">
                        <h6 class="mb-2">Available Players</h6>
                        <div id="lineup-bench" class="list-group border rounded overflow-auto" style="max-height: 52vh;"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer flex-nowrap">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="saveLineupBtn" class="btn btn-primary flex-grow-1 flex-sm-grow-0">Save Lineup</button>
            </div>
        </div>
    </div>
</div>
