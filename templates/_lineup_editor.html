<div class="modal fade" id="lineupEditorModal" tabindex="-1" aria-labelledby="lineupEditorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen-sm-down modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="lineupEditorModalLabel">Edit Batting Lineup</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="lineupTemplateSelect" class="form-label">Load from Template</label>
                        <select id="lineupTemplateSelect" class="form-select">
                            <option value="">-- Select a Template --</option>
                            </select>
                    </div>
                </div>
                <p class="text-muted">Or, build a new lineup below. Drag and drop players...</p>
                <form onsubmit="return false;">
                    <input type="hidden" id="lineupId" name="lineup_id" value="{{ lineup.id if lineup else '' }}">
                    <div class="mb-3">
                        <label for="lineupTitle" class="form-label visually-hidden">Lineup Title</label>
                        <input type="text" class="form-control" id="lineupTitle" value="{{ lineup.title if lineup else '' }}" placeholder="Lineup Title" required>
                    </div>
                    
                    <div class="row" id="lineup-editor-lists">
                        <div class="col-md-7 order-1 order-md-2">
                            <h6>Batting Order</h6>
                            <div id="lineup-order" class="list-group border rounded p-2" style="max-height: 50vh; overflow-y: auto;">
                                </div>
                        </div>
                        <div class="col-md-5 order-2 order-md-1">
                            <h6>Bench</h6>
                            <div id="lineup-bench" class="list-group border rounded p-2" style="max-height: 50vh; overflow-y: auto;">
                                </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer d-flex justify-content-between">
                <span id="lineup-save-timestamp" class="text-muted small align-self-center"></span>
                <div>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    {# MODIFIED: Added an ID to the save button for easier selection in JS #}
                    <button type="button" id="saveLineupBtn" class="btn btn-primary">Save Lineup</button>
                </div>
            </div>
        </div>
    </div>
</div>
