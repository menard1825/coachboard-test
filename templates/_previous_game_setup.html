{# Use Previous Game Setup review sheet. Filled by static/js/previous_game_setup.js
   from /api/game/<id>/previous-setup, which only reads. #}
<div class="modal fade" id="previousSetupModal" tabindex="-1" aria-labelledby="previousSetupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <div class="cb-ps-kicker">Use Previous Game Setup</div>
                    <h5 class="modal-title mb-0" id="previousSetupModalLabel">Copy last game's setup</h5>
                    <div class="cb-ps-subtitle" id="previousSetupSource"></div>
                </div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="previousSetupBody" aria-live="polite">
                <div class="text-center text-muted py-4"><span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading last game…</div>
            </div>
            <div class="modal-footer cb-ps-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" id="previousSetupCancelBtn">Cancel</button>
                <button type="button" class="btn btn-primary" id="previousSetupApplyBtn" disabled>Copy</button>
            </div>
        </div>
    </div>
</div>
