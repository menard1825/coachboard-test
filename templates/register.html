{% extends "auth_base.html" %}
{% block title %}Create Account - CoachBoard{% endblock %}
{% block content %}
<h2 class="auth-title">Join your team</h2>
<p class="auth-subtitle">Use the registration code from your Head Coach. Your email is used for password recovery.</p>
<form method="POST" action="{{ url_for('auth.register') }}">
  <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" value="{{ form.get('full_name','') }}" autocomplete="name" required></div>
  <div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control" id="email" name="email" value="{{ form.get('email','') }}" autocomplete="email" required></div>
  <div class="mb-3"><label class="form-label" for="username">Username</label><input class="form-control" id="username" name="username" value="{{ form.get('username','') }}" autocomplete="username" autocapitalize="none" required></div>
  <div class="mb-3"><label class="form-label" for="password">Password</label><div class="password-wrap"><input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password"><i class="bi bi-eye"></i></button></div><div class="form-text">At least 8 characters.</div></div>
  <div class="mb-3"><label class="form-label" for="registration_code">Team registration code</label><input class="form-control" id="registration_code" name="registration_code" value="{{ registration_code }}" autocapitalize="none" required></div>
  <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus me-1"></i> Create Account</button>
</form>
<div class="auth-divider">ALREADY HAVE AN ACCOUNT?</div>
<div class="text-center small"><a class="auth-link" href="{{ url_for('auth.login') }}">Back to sign in</a></div>
{% endblock %}
