{% extends "auth_base.html" %}
{% block title %}Sign In - CoachBoard{% endblock %}
{% block content %}
<h2 class="auth-title">Sign in</h2>
<p class="auth-subtitle">Open your team workspace, Game Day tools, roster, and pitching board.</p>

<form method="POST" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="client_timezone" data-client-timezone>
  <input type="hidden" name="client_utc_offset_minutes" data-client-utc-offset>
  <div class="mb-3">
    <label class="form-label" for="identity">Username or email</label>
    <input type="text" class="form-control" id="identity" name="identity" value="{{ identity or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
  </div>
  <div class="mb-2">
    <div class="d-flex justify-content-between align-items-center mb-1">
      <label class="form-label mb-0" for="password">Password</label>
      <a class="auth-link small" href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
    </div>
    <div class="password-wrap">
      <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
      <button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
    </div>
  </div>
  <button type="submit" class="btn btn-primary w-100 mt-3"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</button>
</form>

<div class="auth-divider">NEW TO COACHBOARD?</div>
<div class="text-center small">Have a team registration code? <a class="auth-link" href="{{ url_for('auth.register') }}">Create an account</a></div>
{% endblock %}
