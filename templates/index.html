<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pitching Log</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="container">
      <h1>Pitching Log</h1>
      <div class="mb-3">
        <form id="add-log-form">
          <div class="row g-3">
            <div class="col-sm-4">
              <input type="text" class="form-control" id="pitcher-name" placeholder="Pitcher Name" required>
            </div>
            <div class="col-sm-3">
              <input type="text" class="form-control" id="pitch-type" placeholder="Pitch Type" required>
            </div>
            <div class="col-sm-3">
              <input type="number" class="form-control" id="pitch-velocity" placeholder="Pitch Velocity" required>
            </div>
            <div class="col-sm-2">
              <button type="submit" class="btn btn-primary w-100">Add Log</button>
            </div>
          </div>
        </form>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">Pitcher Name</th>
            <th scope="col">Pitch Type</th>
            <th scope="col">Pitch Velocity</th>
          </tr>
        </thead>
        <tbody id="pitching-log-body">
          <!-- Data will be inserted here -->
        </tbody>
      </table>
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  </body>
</html>
