{% extends "base.html" %}

{% block title %}Cumulative Stats{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">Cumulative Player Statistics</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="{{ url_for('home') }}" class="btn btn-sm btn-outline-secondary">
                <i class="bi bi-arrow-left"></i>
                Back to Dashboard
            </a>
        </div>
    </div>

    <div id="stats-content-container">
        <div class="d-flex justify-content-center p-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading Stats...</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
