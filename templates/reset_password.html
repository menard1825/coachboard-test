{% extends "auth_base.html" %}
{% block title %}Reset Password - CoachBoard{% endblock %}
{% block content %}
<h2 class="auth-title">Choose a new password</h2>
<p class="auth-subtitle">Resetting password for <strong>{{ user.full_name or user.username }}</strong>. This link stops working after the password changes.</p>
<form method="POST" action="{{ url_for('auth.reset_password_token', token=token) }}">
  <div class="mb-3"><label class="form-label" for="new_password">New password</label><div class="password-wrap"><input type="password" class="form-control" id="new_password" name="new_password" minlength="8" autocomplete="new-password" required autofocus><button type="button" class="password-toggle" data-password-toggle="new_password" aria-label="Show password"><i class="bi bi-eye"></i></button></div><div class="form-text">At least 8 characters.</div></div>
  <div class="mb-3"><label class="form-label" for="confirm_password">Confirm new password</label><input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" autocomplete="new-password" required></div>
  <button class="btn btn-primary w-100" type="submit"><i class="bi bi-check-circle me-1"></i> Save New Password</button>
</form>
{% endblock %}
