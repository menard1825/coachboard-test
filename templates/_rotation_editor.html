<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-2">
        <h5 class="mb-0" id="rotation-editor-title">Defensive Rotation</h5>
        <div class="d-flex align-items-center gap-2 flex-wrap justify-content-end">
            <div class="btn-group">
                <button type="button" class="btn btn-outline-secondary btn-sm dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-list"></i> Menu
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="#" id="saveRotationBtn"><i class="bi bi-save me-1"></i> Save Rotation</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li class="px-2">
                        <label for="rotationTemplateSelect" class="form-label small visually-hidden">Load Template</label>
                        <select id="rotationTemplateSelect" class="form-select form-select-sm">
                            <option value="">-- Load Template --</option>
                        </select>
                    </li>
                    <li><a class="dropdown-item" href="#" id="saveAsTemplateBtn"><i class="bi bi-journal-plus me-1"></i> Save as New Template</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="#" id="deleteRotationBtn" {% if not rotation or not rotation.id %}disabled{% endif %}><i class="bi bi-trash me-1"></i> Delete Rotation</a></li>
                </ul>
            </div>
        </div>
    </div>
    <div class="card-body" id="rotation-board">
        <div class="mb-3">
            <div class="d-flex align-items-center border rounded p-1 mb-2">
                <div id="inning-btn-group" class="btn-group flex-wrap" role="group">
                    {# Inning radio buttons will be inserted here by JS #}
                </div>
                <div class="btn-group ms-auto" role="group">
                     <button id="addInningBtn" class="btn btn-sm btn-light"><i class="bi bi-plus"></i></button>
                     <button id="removeInningBtn" class="btn btn-sm btn-light"><i class="bi bi-dash"></i></button>
                </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
                <button id="copyPreviousInningBtn" class="btn btn-primary btn-sm"><i class="bi bi-clipboard-plus me-1"></i> Copy Previous</button>
                <div class="btn-group">
                    <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        More Tools
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" id="copyInningBtn">Copy to Multiple...</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-warning" href="#" id="clearInningBtn">Clear Current Inning</a></li>
                    </ul>
                </div>
            </div>
            <div id="inning-paste-controls" class="alert alert-info p-2 mt-2 d-none">
                <span class="fw-bold">Pasting from Inning <span id="pasting-from-inning-display"></span>.</span>
                <p class="mb-1">Select one or more innings to paste to:</p>
                <div id="inning-paste-checkboxes" class="mb-2"></div>
                <button id="pasteToSelectedBtn" class="btn btn-sm btn-success">Paste</button>
                <button id="cancelPasteBtn" class="btn btn-sm btn-secondary">Cancel</button>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-5 mb-4 mb-lg-0">
                <h5 class="mb-3">Inning <span id="current-inning-display">1</span> Assignments</h5>
                <div id="position-assignment-list" class="list-group">
                    </div>
            </div>

            <div class="col-lg-7">
                <div id="svg-diamond-container" class="mb-3 diamond-container-interactive">
                    <svg viewBox="0 0 100 100" id="baseball-diamond-svg" style="width: 100%; height: auto; max-width: 500px; display: block; margin: 0 auto;">
                        <style>
                            .grass { fill: #6b8e23; }
                            .outfield-grass { fill: #719a2e; }
                            .dirt { fill: #cdaa7d; }
                            .base { fill: #fff; stroke: #333; stroke-width: 0.2; }
                            .basepath { fill: none; stroke: #d3b48c; stroke-width: 1; }
                            .position-node { fill: rgba(255,255,255,0.7); stroke: #555; stroke-width: 0.3; }
                            .position-label { font-size: 3px; font-weight: bold; font-family: sans-serif; text-anchor: middle; pointer-events: none; fill: #333; }
                            .player-token-text-name { font-size: 1.8px; text-anchor: middle; fill: white; font-weight: bold; }
                            .player-token-text-num { font-size: 2.5px; text-anchor: middle; fill: white; font-weight: bold; }
                        </style>
                        <path class="grass" d="M 50 0 L 100 50 L 50 100 L 0 50 Z" />
                        <path class="outfield-grass" d="M 50 0 C 20 0, 0 20, 0 50 L 50 100 L 100 50 C 100 20, 80 0, 50 0 Z M 50 10 L 90 50 L 50 90 L 10 50 Z" />
                        <path class="dirt" d="M 50 15 A 35 35 0 0 1 85 50 L 50 85 L 15 50 A 35 35 0 0 1 50 15 Z" />
                        <path class="basepath" d="M 50 90 L 90 50 L 50 10 L 10 50 Z" />
                        <rect x="47.5" y="87.5" width="5" height="5" class="base" />
                        <rect x="87.5" y="47.5" width="5" height="5" class="base" transform="rotate(45 90 50)" />
                        <rect x="7.5" y="47.5" width="5" height="5" class="base" transform="rotate(45 10 50)" />
                        <rect x="47.5" y="7.5" width="5" height="5" class="base" transform="rotate(45 50 10)" />
                        <circle cx="50" cy="50" r="6" class="dirt" stroke="#fff" stroke-width="0.3" />

                        </svg>
                </div>

                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#bench-tab">Bench</a></li>
                    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#summary-tab">Playing Time</a></li>
                </ul>
                <div class="tab-content border border-top-0 rounded-bottom p-2">
                    <div class="tab-pane fade show active" id="bench-tab">
                        <div id="bench-list-visual"></div>
                    </div>
                    <div class="tab-pane fade" id="summary-tab">
                        <div id="summary-visual"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
