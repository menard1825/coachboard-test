name: Test 2 Dead Code Cleanup

on:
  push:
    branches:
      - fix/gameday-dugout-ux

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run Test 2 dead-code cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameday-dugout-ux
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Remove retired legacy swap workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('static/js/game_logic.js')
          text = path.read_text()
          start = "        let swapPlayer1 = null;\n"
          end = "        document.getElementById('liveUndoBtn')?.addEventListener('click', () => {"
          assert text.count(start) == 1, 'Expected one retired swap workflow start marker'
          assert text.count(end) == 1, 'Expected one live Undo marker'
          a = text.index(start)
          b = text.index(end, a)
          path.write_text(text[:a] + text[b:])

          forbidden = ('liveDefensiveChangeBtn', 'liveDefensiveSwapModal', 'handleLiveSwapClick', 'cb-live-field-editor')
          leftovers = []
          for root in (Path('static/js'), Path('templates')):
              for item in root.rglob('*'):
                  if not item.is_file() or item.suffix not in {'.js', '.html'}:
                      continue
                  body = item.read_text(errors='ignore')
                  for token in forbidden:
                      if token in body:
                          leftovers.append(f'{item}: {token}')
          assert not leftovers, 'Retired Defense Change UI still present:\n' + '\n'.join(leftovers)
          PY

      - name: Syntax and regression checks
        env:
          SECRET_KEY: ci-test-secret
          COACHBOARD_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find static/js -type f -name '*.js' -print0 | sort -z)
          python -m pytest -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Full Playwright suite
        env:
          COACHBOARD_E2E: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p test-results/e2e
          set -o pipefail
          python -u -m pytest -vv tests/e2e --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --output test-results/e2e 2>&1 | tee test-results/e2e/pytest-output.txt

      - name: Upload cleanup browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test2-cleanup-playwright-results
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit cleanup and remove this workflow
        if: success()
        run: |
          rm .github/workflows/test2-dead-code-cleanup.yml
          git config user.name 'CoachBoard CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove retired Defense Change code paths'
          git push origin HEAD:fix/gameday-dugout-ux
