name: Pitching Navigation Fix

on:
  push:
    branches:
      - fix/gameday-dugout-ux

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gameday-dugout-ux
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply pitching fixes
        run: python scripts/pitching_nav_fix.py

      - name: Syntax and regression checks
        env:
          SECRET_KEY: ci-test-secret
          COACHBOARD_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          set -euo pipefail
          node --check static/js/pitching_dugout_mobile.js
          python -m py_compile tests/e2e/test_pitching_ux.py
          python -m pytest -q

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Pitching Playwright coverage
        env:
          COACHBOARD_E2E: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          mkdir -p test-results/e2e
          python -u -m pytest -vv tests/e2e/test_pitching_ux.py tests/e2e/test_pitching_ipad_ux.py --browser chromium --tracing retain-on-failure --screenshot only-on-failure --video retain-on-failure --output test-results/e2e

      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pitching-nav-fix-results
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit fix and remove temporary files
        if: success()
        run: |
          rm .github/workflows/pitching-nav-fix.yml scripts/pitching_nav_fix.py
          git config user.name 'CoachBoard CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix pitching mobile navigation and detail controls'
          git push origin HEAD:fix/gameday-dugout-ux
