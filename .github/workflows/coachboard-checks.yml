name: CoachBoard Checks

on:
  push:
  pull_request:

# A newer commit on a branch cancels that branch's older run. Each main run
# gets its own group, so a main run is never cancelled or held back.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Python compile checks
        run: |
          python -m py_compile \
            app.py \
            models.py \
            lineup_service.py \
            game_pitching_rules.py \
            pitching_rule_presets.py \
            migrations/versions/d4f8b2a719ce_normalize_lineup_templates.py \
            migrations/versions/f9a2b6c4d1e7_add_team_fair_play_settings.py \
            migrations/versions/3d9c8b7a4f21_add_team_pitching_preferences.py \
            migrations/versions/5a7c2d9e4b11_add_activity_log.py \
            migrations/versions/8b1d4f6a2c90_add_activity_timezone_context.py \
            blueprints/auth.py \
            blueprints/roster.py \
            blueprints/fair_play.py \
            season_stats.py \
            blueprints/security_guard.py \
            blueprints/postgame_navigation.py \
            blueprints/live_game_bulk_api.py \
            blueprints/live_game_write_lock.py \
            blueprints/live_game_clock.py \
            blueprints/live_game_pitching_api.py \
            blueprints/stats_dashboard.py

      - name: JavaScript syntax checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --check "$file"
          done < <(find static/js -type f -name '*.js' -print0 | sort -z)

      - name: Migration chain check
        env:
          SECRET_KEY: ci-test-secret
          COACHBOARD_ENV: test
          DATABASE_URL: 'sqlite:///ci-lineup-migration.db'
          FLASK_APP: app.py
        run: |
          flask db heads
          flask db upgrade

      - name: Regression tests
        env:
          SECRET_KEY: ci-test-secret
          COACHBOARD_ENV: test
          DATABASE_URL: 'sqlite:///:memory:'
        run: python -m pytest -q

  # The browser suite, split by whole test file across four runners
  # (tests/e2e/shard.py). Each shard has its own checkout, Python, Chromium,
  # app server and SQLite database; nothing is shared. Shards start at once,
  # independently of the job above, so a failing Python test never hides
  # browser results.
  browser-shard:
    name: Playwright shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    # A green shard usually takes 13-19 minutes, setup included, and one
    # took 25 on a slow runner (CI #1463); 40 leaves room for that and
    # still stops a hung shard well before the old 60.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # The exact pinned files require_vendored_assets() expects, each checked
      # against its SHA-256 (any mismatch fails the job). The CDN hosts are
      # then blocked, so a page can never quietly load them from the network.
      - name: Vendor CDN assets
        run: |
          python tests/e2e/fetch_cdn_assets.py "$RUNNER_TEMP/cdn"
          echo "COACHBOARD_CDN_DIR=$RUNNER_TEMP/cdn" >> "$GITHUB_ENV"
          echo '0.0.0.0 cdn.jsdelivr.net cdn.socket.io' | sudo tee -a /etc/hosts
          if curl -sS --max-time 10 -o /dev/null https://cdn.jsdelivr.net/; then
            echo 'The CDN is still reachable; refusing to run.' >&2
            exit 1
          fi

      - name: Choose this shard's test files
        env:
          COACHBOARD_E2E: '1'
        run: python tests/e2e/shard.py files ${{ matrix.shard }} 4 > "$RUNNER_TEMP/shard-files.txt"

      - name: Run Playwright shard ${{ matrix.shard }}/4
        env:
          COACHBOARD_E2E: '1'
          COACHBOARD_E2E_REQUIRE_CDN: '1'
          PYTHONUNBUFFERED: '1'
        run: >-
          xargs -r -a "$RUNNER_TEMP/shard-files.txt"
          python -u -m pytest -vv
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --video retain-on-failure
          --output test-results/e2e
          --junitxml test-results/junit-shard-${{ matrix.shard }}.xml

      - name: Upload browser failure details (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coachboard-playwright-results-shard-${{ matrix.shard }}
          path: test-results/e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JUnit results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coachboard-playwright-junit-shard-${{ matrix.shard }}
          path: test-results/junit-shard-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7

  # The one result to require: every shard passed, and every collected E2E
  # test ran exactly once across them.
  browser-tests:
    name: Playwright browser tests
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: coachboard-playwright-junit-shard-*
          path: junit

      - name: Every collected E2E test ran exactly once; every shard passed
        env:
          COACHBOARD_E2E: '1'
          SHARDS_RESULT: ${{ needs.browser-shard.result }}
        run: |
          status=0
          python tests/e2e/shard.py verify 4 junit || status=1
          if [ "$SHARDS_RESULT" != 'success' ]; then
            echo "Browser shards: $SHARDS_RESULT" >&2
            status=1
          fi
          exit $status
